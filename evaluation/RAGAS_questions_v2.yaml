# ============================================================
# RAGAS Evaluation Dataset v2  (台灣企業 ESG RAG)
# ------------------------------------------------------------
# 校正紀錄（2026-04-30）：
#   - 已用 /compare、/query API 對所有題目實跑驗證
#   - Q4/Q7/Q9/Q16/Q19 ground_truth 依實際 API 回答校正
#   - Q11/Q12/Q13/Q14/Q15/Q18/Q20 系統目前回 abstain，
#     但「理論上應答得出來」，標記 retrieval_known_issue: true
#     重構知識庫（text-only chunks / chunk 切分優化）後再重跑驗證
#   - Q21 want_source_page 路由正確但 page_chunks 為空（資料層問題）
#   - Q27 ticker 5347 不在索引 → 替換為 2344 華邦電
# ------------------------------------------------------------
# 結構：
#   - id                   題號
#   - category             測試分類（用於聚合報告）
#   - question             輸入問句
#   - ground_truth         標準答案（abstain 類請填「未揭露」）
#   - expected_intents     parse_query 預期輸出 (rag.py)
#   - expected_tickers     預期解析出的 ticker
#   - expected_industry    預期 industry_code（無則 null）
#   - want_source_page     預期 want_source_page bool
#   - metrics_applicable   可套用的 RAGAS 指標
#       * faithfulness         所有題
#       * answer_relevancy     abstain / off_topic 題不適用
#       * context_precision    需要檢索的題目
#       * context_recall       有具體 ground_truth 的題目
#       * abstain_accuracy     custom：abstain 類的「會不會誠實說沒有」
#       * routing_accuracy     custom：intents/tickers 解析正確率
#   - expect_abstain       是否預期系統回拒答（"未揭露/未找到"）
#   - notes                出題目的與評分注意事項
# ============================================================

